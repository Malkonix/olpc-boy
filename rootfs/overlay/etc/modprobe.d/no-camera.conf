# The camera controller (cafe_ccic) shares the CAFE chip with the NAND: its probe
# disturbs NAND reads in flight (JFFS2 then sees another page's data and drops the
# node as bad CRC).  olpc-boy has no use for the camera: never load it.
blacklist cafe_ccic
blacklist ov7670
install cafe_ccic /bin/false
install ov7670 /bin/false
