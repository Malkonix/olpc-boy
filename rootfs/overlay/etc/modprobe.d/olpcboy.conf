# Wifi is OFF by default.  `blacklist` only stops *alias* (modalias) autoload;
# olpc-selftest loads usb8xxx explicitly by name, which still works.
blacklist libertas_usb
blacklist libertas
blacklist libertas_cs
blacklist usb8xxx

# NAND POLICY.  The internal NAND controller driver must never be loaded by
# the hardware coldplug (hwdrivers / mdev `modprobe -b $MODALIAS`), by
# /etc/modules, or by a stray script: probing it writes a bad-block table to
# the flash.
#   `blacklist`  stops modalias autoload (modprobe -b);
#   `install ... /bin/false` makes even an explicit `modprobe cafe_nand` fail.
# A deliberate load needs the override:   modprobe --ignore-install cafe_nand
blacklist cafe_nand
install cafe_nand /bin/false
# the MTD block translation layer would expose the NAND as a disk
blacklist mtdblock
install mtdblock /bin/false
blacklist mtd_blkdevs
